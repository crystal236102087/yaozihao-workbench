            return;
          }
          data = { ...defaultData, ...parsed };
          ['home', 'sport'].forEach(k => {
            if (parsed.tasks && parsed.tasks[k]) data.tasks[k] = parsed.tasks[k];
          });
          ['chinese', 'math', 'english', 'science'].forEach(k => {

          if (parsed.textbooks) data.textbooks = parsed.textbooks;
          if (parsed.rewards) data.rewards = parsed.rewards;
          if (parsed.calendar) data.calendar = parsed.calendar;
        } catch (e) {}
      }
    }

    }

    function formatDate(date) {
      const m = date.getMonth() + 1;
      const d = date.getDate();
      const w = weekDays[date.getDay()];
      return `${m}月${d}日 ${w}`;
    }

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getTodayWeekDay() {
      return new Date().getDay();
    }

    function calcProgress() {
      let total = 0, done = 0;
      data.tasks.sport.forEach(t => { total++; if(t.done) done++; });
      ['chinese','math','english','science'].forEach(sub => {
        for (let i=0;i<7;i++) {
          data.tasks[sub][i].forEach(t => { total++; if(t.done) done++; });
        }
      });
      return total === 0 ? 0 : Math.round(done / total * 100);
    }

    function calcTodayDone() {
      const w = getTodayWeekDay();
      let total = data.tasks.sport.length + data.tasks.chinese[w].length + data.tasks.math[w].length + data.tasks.english[w].length + data.tasks.science[w].length;
      let done = 0;
      data.tasks.sport.forEach(t => { if(t.done) done++; });
      [data.tasks.chinese[w], data.tasks.math[w], data.tasks.english[w], data.tasks.science[w]].forEach(arr => arr.forEach(t => { if(t.done) done++; }));
      return { total, done };
    }

    function updateCalendarStatus() {
      const { total, done } = calcTodayDone();
      const key = todayKey();
      if (total === 0) data.calendar[key] = 'none';
      else if (done === total) data.calendar[key] = 'full';
      else if (done > 0) data.calendar[key] = 'partial';
      else data.calendar[key] = 'missed';

      data.fullDays = Object.values(data.calendar).filter(s => s === 'full').length;
      data.missed = Object.values(data.calendar).filter(s => s === 'missed').length;

      let streak = 0;
      const d = new Date();
      while (true) {
        const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        if (data.calendar[k] === 'full') { streak++; d.setDate(d.getDate() - 1); }
        else if (k === todayKey() && data.calendar[k] !== 'missed') { d.setDate(d.getDate() - 1); }
        else break;
      }
      data.streak = streak;
    }

    function updateNavSun() {
      document.getElementById('nav-sun').textContent = data.sun;
    }

    function renderNav() {
      const nav = document.getElementById('sidebar-nav');
      nav.innerHTML = navItems.map(item => `

          <span class="text-[10px] md:text-xs font-black leading-tight text-center">${item.label}</span>
        </button>
      `).join('');
    }

            <div class="space-y-3">
              <div class="flex justify-between items-center p-3 bg-gradient-to-r from-boyblue-50 to-boyblue-100 rounded-xl border-2 border-boyblue-200">

                <span class="text-2xl font-black text-amber-500">${data.sun}</span>
              </div>
              <div class="flex justify-between items-center p-3 bg-gradient-to-r from-boyblue-50 to-boyblue-100 rounded-xl border-2 border-boyblue-200">
                <span class="text-slate-600 font-black">连续全勤</span>
                <span class="text-xl font-black text-boyblue-500">${data.streak} 天</span>
              </div>

                <span class="text-slate-600 font-black">漏打卡</span>
                <span class="text-xl font-black text-candy-red">${data.missed} 天</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 今日任务卡片：汇总当天语数英科+运动 -->
        <div class="mb-5">
          <h3 class="text-xl font-black text-slate-700 flex items-center gap-2 mb-4">
            <span class="text-2xl">🎯</span> 今日任务卡片
          </h3>
          ${(() => {
            const w = getTodayWeekDay();
            // 汇总当天所有科目任务
            const groups = [
              { key: 'chinese', label: '语文', icon: '📝', color: 'from-emerald-100 to-green-100 border-emerald-200', tasks: data.tasks.chinese[w] },
              { key: 'math', label: '数学', icon: '🧮', color: 'from-blue-100 to-sky-100 border-blue-200', tasks: data.tasks.math[w] },
              { key: 'english', label: '英语', icon: '🌈', color: 'from-amber-100 to-yellow-100 border-amber-200', tasks: data.tasks.english[w] },

                      ${task.done ? '' : `<span class="ml-auto text-[10px] font-black text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full shrink-0">☀️+${task.sun || 5}</span>`}
                    </label>

                </div>
              </div>

          })()}
        </div>
      `;

    // 今日任务勾选(同步到各科目)
    function toggleTodayTask(subject, dayIdx, id, el) {
      let task;
      if (subject === 'sport') {
        task = data.tasks.sport.find(t => t.id === id);
      } else {
        task = data.tasks[subject][dayIdx].find(t => t.id === id);
      }
      if (!task) return;
      task.done = el.checked;
      if (task.done) { data.sun += (task.sun || 5); showToast('完成任务，获得 ' + (task.sun || 5) + ' 阳光！'); }
      else { data.sun -= (task.sun || 5); }
      updateCalendarStatus();
      saveData();
      renderMain();
    }

    // ==================== 打卡记录 ====================
    function renderCalendar() {
      const year = currentMonth.getFullYear();

      const firstDay = new Date(year, month, 1);

      return `

            <h2 class="text-2xl font-black text-slate-700">${year}年 ${month + 1}月</h2>
            <button onclick="changeMonth(1)" class="w-11 h-11 rounded-full bg-boyblue-100 hover:bg-boyblue-200 text-boyblue-600 font-black text-xl shadow-btn">›</button>
          </div>

            <div class="bg-gradient-to-br from-boyblue-50 to-boyblue-100 rounded-2xl p-4 text-center border-2 border-boyblue-200">

            <div class="bg-gradient-to-br from-emerald-50 to-emerald-100 rounded-2xl p-4 text-center border-2 border-emerald-200">

              <div class="text-sm text-slate-500 font-black">满分天数</div>

            <div class="bg-gradient-to-br from-rose-50 to-rose-100 rounded-2xl p-4 text-center border-2 border-rose-200">
              <div class="text-3xl font-black text-rose-500">${data.missed}</div>
              <div class="text-sm text-slate-500 font-black">漏打卡</div>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-1 md:gap-2 mb-2 text-center">
            ${weekDays.map(d => `<div class="text-xs md:text-sm font-black text-slate-400 py-2">${d}</div>`).join('')}
          </div>
          <div class="grid grid-cols-7 gap-1 md:gap-2">
            ${Array(startWeekDay).fill('<div></div>').join('')}

              const key = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
              const status = data.calendar[key] || 'none';
              const isToday = key === todayKey();
              const statusClass = {
                full: 'bg-gradient-to-br from-emerald-200 to-emerald-300 text-emerald-700 border-2 border-emerald-400',
                partial: 'bg-gradient-to-br from-amber-200 to-amber-300 text-amber-700 border-2 border-amber-400',
                missed: 'bg-gradient-to-br from-rose-200 to-rose-300 text-rose-600 border-2 border-rose-400',
                none: 'bg-slate-50 text-slate-400 border-2 border-slate-100'
              }[status];
              const mark = status === 'missed' ? '×' : (status === 'full' ? '✓' : '');
              return `
                <div class="calendar-day rounded-xl ${statusClass} ${isToday ? 'ring-2 ring-boyblue-400 ring-offset-2' : ''} flex flex-col items-center justify-center text-xs md:text-sm font-black cursor-pointer hover:opacity-80 transition">
                  <span>${day}</span>
                  ${mark ? `<span class="text-[10px]">${mark}</span>` : ''}
                </div>
              `;
            }).join('')}
          </div>

          <div class="flex flex-wrap gap-3 md:gap-4 mt-6 text-xs md:text-sm">
            <div class="flex items-center gap-2 font-bold text-slate-500"><span class="w-4 h-4 rounded bg-emerald-300 border border-emerald-400"></span> 全部完成</div>
            <div class="flex items-center gap-2 font-bold text-slate-500"><span class="w-4 h-4 rounded bg-amber-300 border border-amber-400"></span> 部分完成</div>
            <div class="flex items-center gap-2 font-bold text-slate-500"><span class="w-4 h-4 rounded bg-rose-300 border border-rose-400"></span> 未打卡</div>
            <div class="flex items-center gap-2 font-bold text-slate-500"><span class="w-4 h-4 rounded bg-slate-50 border border-slate-100"></span> 无任务/未来</div>
          </div>
        </div>
      `;
    }

    function changeMonth(delta) {

    // 根据学科和任务文字生成搜索链接
    function getTaskSearchUrl(subject, taskText) {
      const subjectName = { chinese: '语文', math: '数学', english: '英语', science: '科学' }[subject];
      const query = encodeURIComponent(`${subjectName} 四年级 ${taskText}`);
      return `https://www.baidu.com/s?wd=${query}`;
    }

    function selectSubjectDay(subject, dayIdx) {
      currentSubjectDay[subject] = dayIdx;
      renderMain();
    }

    function toggleSubjectTask(subject, dayIdx, id, el) {
      const task = data.tasks[subject][dayIdx].find(t => t.id === id);
      if (!task) return;
      task.done = el.checked;
      if (task.done) { data.sun += 5; showToast('完成任务，获得 5 阳光！'); }
      else { data.sun -= 5; }
      updateCalendarStatus();
      saveData();
      renderMain();
    }

    // 添加自定义任务
    function addSubjectTask(subject, dayIdx) {
      const text = prompt('请输入新任务内容：');
      if (!text || !text.trim()) return;
      const newId = 't' + Date.now();
      data.tasks[subject][dayIdx].push({ id: newId, text: text.trim(), done: false });
      saveData();
      renderMain();
      showToast('已添加新任务 ✏️');
    }

    // 删除任务
    function delSubjectTask(subject, dayIdx, id) {
      if (!confirm('确定删除这个任务吗？')) return;
      const tasks = data.tasks[subject][dayIdx];
      const idx = tasks.findIndex(t => t.id === id);
      if (idx === -1) return;
      if (tasks[idx].done) data.sun -= 5;  // 已完成的扣回阳光
      tasks.splice(idx, 1);
      saveData();
      renderMain();
      showToast('已删除任务 🗑️');
    }

      const name = prompt('请输入书名：');

      const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

      showToast('已删除记录 🗑️');

    // 添加今日阅读记录
    function addDailyLog() {
      const today = todayKey();
      if (!data.tasks.reading.dailyLog[today]) data.tasks.reading.dailyLog[today] = [];
      const book = prompt('今天读了哪本书？（书名）');
      if (!book || !book.trim()) return;
      const minutes = prompt('读了多少分钟？', '20');
      if (!minutes) return;
      const pages = prompt('读了多少页？', '10');
      if (!pages) return;
      const wasEmpty = data.tasks.reading.dailyLog[today].length === 0;
      data.tasks.reading.dailyLog[today].push({
        id: 'log' + Date.now(),
        book: book.trim(),
        minutes: parseInt(minutes) || 0,
        pages: parseInt(pages) || 0
      });
      if (wasEmpty) {
        data.sun += 5;
        showToast('今日阅读已打卡，获得 5 阳光！📖');
      } else {

      saveData();
      renderMain();
    }

      let icon = '🎉';

      else if (name.includes('动画') || name.includes('电视') || name.includes('佩奇') || name.includes('动漫')) icon = '📺';
      else if (name.includes('手机') || name.includes('平板')) icon = '📱';
      else if (name.includes('羽毛')) icon = '🏸';
      else if (name.includes('户外') || name.includes('跑') || name.includes('球') || name.includes('跳')) icon = '⚽';
      else if (name.includes('画')) icon = '🎨';
      else if (name.includes('拼')) icon = '🧩';
      else if (name.includes('游戏')) icon = '🎮';
      if (!data.tasks.fun.dailyLog[today]) data.tasks.fun.dailyLog[today] = [];
      data.tasks.fun.dailyLog[today].push({
        id: 'fun' + Date.now(),
        name: name,
        icon: icon,
        minutes: 0,
        note: ''
      });
      saveData();
      renderMain();
      showToast('已记录：' + name + ' ' + icon);
    }

    // 删除娱乐记录

      if (!confirm('确定删除这条记录吗？')) return;
      if (data.tasks.fun.dailyLog[date]) {
        data.tasks.fun.dailyLog[date] = data.tasks.fun.dailyLog[date].filter(l => l.id !== id);
        if (data.tasks.fun.dailyLog[date].length === 0) delete data.tasks.fun.dailyLog[date];

      renderMain();
      showToast('已删除记录 🗑️');

    // 朗读中文古诗（TTS）
    function speakChinese(text) {
      if (!window.speechSynthesis) { showToast('浏览器不支持语音朗读', '⚠️'); return; }
      window.speechSynthesis.cancel();
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = 0.8;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
      showToast('正在朗读 📢');
    }

    // 原声音频映射表（后期填入真实 mp3 URL 后自动优先使用原声）
    // 现在为空，全部走 TTS 机器发音；拿到人教社原声文件后按 { '单词': 'mp3地址' } 填入即可
    const audioMap = {};

    // 朗读文本：有原声用原声，否则用 TTS
    function speakText(text) {
      // 1. 优先播放原声 mp3
      if (audioMap[text]) {
        try {
          const audio = new Audio(audioMap[text]);
          audio.play().catch(() => fallbackTTS(text));
          return;
        } catch (e) { /* 失败则走 TTS */ }
      }
      fallbackTTS(text);
    }

    // TTS 机器发音兜底（语速慢、清晰，尽量接近教学发音）
    function fallbackTTS(text) {
      if (!window.speechSynthesis) {
        showToast('你的浏览器不支持语音朗读', '⚠️');
        return;
      }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.75;   // 更慢，便于跟读
      utter.pitch = 1.0;   // 平稳音调，接近原声
      utter.volume = 1.0;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

    // 播放人教社官方原声音频
    let currentAudio = null;
    function playAudio(url) {
      if (!url) { showToast('暂无音频', '⚠️'); return; }
      // 停止当前播放
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      // 也停止 TTS
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      currentAudio = new Audio(url);
      currentAudio.play().then(() => {
        showToast('正在播放原声音频 🎵');
      }).catch(() => {
        showToast('音频加载失败，请稍后重试', '⚠️');
      });
      currentAudio.addEventListener('ended', () => { currentAudio = null; });
    }

      };

      return `
        <div class="mb-6">
          <h2 class="text-2xl md:text-3xl font-black text-slate-700 mb-5 flex items-center gap-2"><span class="text-3xl sticker-shadow animate-bounce-slow">📖</span> 四上教材</h2>

          <!-- 科目选择：一排四个 -->
          <div class="bg-white rounded-3xl p-4 shadow-card border-4 border-boyblue-100 card-hover mb-6">
            <div class="flex gap-2">
              ${renderSubjectTabs()}
            </div>
          </div>

          <!-- 当前科目学习区 -->
          <div class="bg-white rounded-3xl p-5 md:p-6 shadow-card border-4 border-boyblue-100 card-hover">
            <div class="flex items-center gap-3 mb-5">
              <span class="text-3xl">${cfg.icon}</span>
              <h3 class="text-xl md:text-2xl font-black text-slate-700">${cfg.title}</h3>
            </div>

            ${renderContentTabs()}

            <div class="mt-4">
              ${renderContent()}
            </div>
          </div>
        </div>
      `;
    }

    function setBookTab(tab) {
      currentBookTab = tab;
      renderMain();
    }

    function setBookUnit(idx) {
      currentBookUnit = idx;
      renderMain();
    }

    function setTextbookSubject(subject) {
      currentTextbookSubject = subject;
      currentBookTab = '';  // 切换科目后不默认显示任何内容
      renderMain();
    }

    function updateBookProgress(id, delta) {
      const book = data.textbooks.find(b => b.id === id);
      if (!book) return;
      book.progress = Math.max(0, Math.min(100, book.progress + delta));
      saveData();
      renderMain();
    }

    // ==================== 奖励中心 ====================
    function renderReward() {
      return `
        <div class="mb-6">
          <div class="bg-gradient-to-r from-amber-200 to-yellow-200 rounded-3xl p-6 shadow-soft mb-6 flex items-center gap-4 border-4 border-amber-300 card-hover">
            <span class="text-5xl sticker-shadow animate-wiggle">☀️</span>
            <div>
              <div class="text-4xl md:text-5xl font-black text-amber-600">${data.sun}</div>
              <div class="text-amber-700 font-black">可用阳光</div>
            </div>
          </div>

          <div class="flex items-center justify-between mb-4">
            <h3 class="text-xl md:text-2xl font-black text-slate-700 flex items-center gap-2"><span class="text-2xl">🎯</span> 奖励清单</h3>
            <span class="text-sm text-slate-400 bg-white px-3 py-1 rounded-full shadow-sm font-black border-2 border-slate-100">${data.rewards.length} 项</span>
          </div>

          <div class="space-y-3 mb-6">
            ${data.rewards.map(reward => `
              <div class="bg-white rounded-2xl p-4 shadow-card border-4 border-boyblue-100 flex items-center justify-between card-hover">
                <div class="flex items-center gap-4">
                  <span class="text-4xl sticker-shadow">${reward.icon}</span>
                  <div>
                    <h4 class="font-black text-slate-700 text-lg">${reward.name}</h4>
                    <div class="text-amber-500 font-black text-sm flex items-center gap-1">${reward.cost} <span>☀️</span></div>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <button onclick="redeemReward('${reward.id}')" class="px-4 py-2 rounded-xl ${data.sun >= reward.cost ? 'bg-gradient-to-r from-boyblue-400 to-boyblue-500 text-white hover:from-boyblue-500 hover:to-boyblue-600 shadow-btn' : 'bg-slate-200 text-slate-400 cursor-not-allowed'} font-black text-sm">兑换</button>
                  <button onclick="deleteReward('${reward.id}')" class="w-9 h-9 rounded-full bg-rose-100 text-rose-500 hover:bg-rose-200 flex items-center justify-center font-black text-lg shadow-btn">×</button>
                </div>
              </div>
            `).join('')}
          </div>

          <button onclick="showAddReward()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-boyblue-400 to-boyblue-500 text-white font-black text-lg flex items-center justify-center gap-2 hover:from-boyblue-500 hover:to-boyblue-600 transition shadow-soft">
            <span>➕</span> 添加奖励
          </button>

          <div id="add-reward-form" class="hidden mt-4 bg-white rounded-2xl p-4 shadow-card border-4 border-boyblue-100">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <input type="text" id="reward-name" placeholder="奖励名称" class="px-4 py-2 rounded-xl bg-boyblue-50 border-2 border-boyblue-100 focus:outline-none focus:border-boyblue-400 font-bold">
              <input type="number" id="reward-cost" placeholder="所需阳光" class="px-4 py-2 rounded-xl bg-boyblue-50 border-2 border-boyblue-100 focus:outline-none focus:border-boyblue-400 font-bold">
              <input type="text" id="reward-icon" placeholder="图标 emoji" class="px-4 py-2 rounded-xl bg-boyblue-50 border-2 border-boyblue-100 focus:outline-none focus:border-boyblue-400 font-bold">
            </div>
            <div class="flex gap-2 mt-3">
              <button onclick="addReward()" class="flex-1 py-2 rounded-xl bg-gradient-to-r from-boyblue-400 to-boyblue-500 text-white font-black hover:from-boyblue-500 hover:to-boyblue-600 shadow-btn">确认添加</button>
              <button onclick="hideAddReward()" class="flex-1 py-2 rounded-xl bg-slate-100 text-slate-600 font-black hover:bg-slate-200 shadow-btn">取消</button>
            </div>
          </div>
        </div>
      `;
    }

    function redeemReward(id) {
      const reward = data.rewards.find(r => r.id === id);
      if (!reward || data.sun < reward.cost) return;
      data.sun -= reward.cost;
      saveData();
      showToast(`兑换成功：${reward.name}！`, '🎉');
      renderMain();
    }

    function deleteReward(id) {
      data.rewards = data.rewards.filter(r => r.id !== id);
      saveData();
      renderMain();
    }

    function showAddReward() { document.getElementById('add-reward-form').classList.remove('hidden'); }
    function hideAddReward() { document.getElementById('add-reward-form').classList.add('hidden'); }

    function addReward() {
      const name = document.getElementById('reward-name').value.trim();
      const cost = parseInt(document.getElementById('reward-cost').value) || 0;
      const icon = document.getElementById('reward-icon').value.trim() || '🎁';
      if (!name || cost <= 0) { showToast('请填写完整奖励信息', '⚠️'); return; }
      data.rewards.push({ id: 'r' + Date.now(), icon, name, cost });
      saveData();
      hideAddReward();
      renderMain();
      showToast('奖励添加成功！');
    }

    // ==================== 统计 ====================
    function renderStats() {
      const progress = calcProgress();
      const subjectTotals = { chinese: 0, math: 0, english: 0, science: 0 };
      const subjectDone = { chinese: 0, math: 0, english: 0, science: 0 };
      ['chinese','math','english','science'].forEach(sub => {
        for (let i=0;i<7;i++) {
          data.tasks[sub][i].forEach(t => {
            subjectTotals[sub]++;
            if (t.done) subjectDone[sub]++;
          });
        }
      });

      return `
        <div class="mb-6">
          <h2 class="text-2xl md:text-3xl font-black text-slate-700 mb-6 flex items-center gap-2"><span class="text-3xl sticker-shadow animate-bounce-slow">📊</span> 学习统计</h2>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white rounded-2xl p-5 shadow-card border-4 border-boyblue-100 text-center card-hover">
              <div class="text-3xl md:text-4xl font-black text-boyblue-500">${progress}%</div>
              <div class="text-sm text-slate-500 font-black">整体完成率</div>
            </div>
            <div class="bg-white rounded-2xl p-5 shadow-card border-4 border-boyblue-100 text-center card-hover">
              <div class="text-3xl md:text-4xl font-black text-amber-500">${data.sun}</div>
              <div class="text-sm text-slate-500 font-black">累计阳光</div>
            </div>
            <div class="bg-white rounded-2xl p-5 shadow-card border-4 border-boyblue-100 text-center card-hover">
              <div class="text-3xl md:text-4xl font-black text-emerald-500">${data.fullDays}</div>
              <div class="text-sm text-slate-500 font-black">满分天数</div>
            </div>
          </div>

          <div class="bg-white rounded-3xl p-6 shadow-card border-4 border-boyblue-100 card-hover">
            <h3 class="font-black text-slate-700 mb-4 text-lg">各学科完成情况</h3>
            <div class="space-y-4">
              ${[
                { key: 'chinese', label: '语文', color: 'from-emerald-400 to-emerald-500' },
                { key: 'math', label: '数学', color: 'from-blue-400 to-blue-500' },
                { key: 'english', label: '英语', color: 'from-amber-400 to-amber-500' },
                { key: 'science', label: '科学', color: 'from-purple-400 to-purple-500' },
              ].map(s => {
                const pct = subjectTotals[s.key] ? Math.round(subjectDone[s.key] / subjectTotals[s.key] * 100) : 0;
                return `
                  <div>
                    <div class="flex justify-between text-sm mb-1">
                      <span class="font-black text-slate-600">${s.label}</span>
                      <span class="text-slate-400 font-bold">${subjectDone[s.key]}/${subjectTotals[s.key]}</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden border-2 border-slate-200">
                      <div class="bg-gradient-to-r ${s.color} h-full rounded-full transition-all" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ==================== 主渲染 ====================
    function renderMain() {
      const main = document.getElementById('main-content');
      const headerDate = `<p class="text-slate-400 text-sm mb-6 font-bold">${formatDate(new Date())}</p>`;

      let content = '';
      switch (currentNav) {
        case 'home': content = renderHome(); break;
        case 'calendar': content = renderCalendar(); break;
        case 'chinese': content = renderSubject('chinese', '📝'); break;
        case 'math': content = renderSubject('math', '🧮'); break;
        case 'english': content = renderSubject('english', '🌈'); break;
        case 'science': content = renderSubject('science', '🔬'); break;
        case 'reading': content = renderReading(); break;
        case 'sport': content = renderSport(); break;
        case 'textbook': content = renderTextbook(); break;
        case 'fun': content = renderFun(); break;
        case 'reward': content = renderReward(); break;
        case 'stats': content = renderStats(); break;
      }

      main.innerHTML = (currentNav === 'home' ? '' : headerDate) + content;
    }

    function init() {
      loadData();
      renderNav();
      renderMain();
      updateNavSun();
      updateCalendarStatus();
      saveData();
    }

    init();
  </script>
  <script>
    // 注册 Service Worker 实现 PWA 离线可用
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('学习工作台已可离线使用');
        }).catch((err) => {
          console.log('离线功能未启用:', err);
        });
      });
    }
  </script>
</body>
</html>
